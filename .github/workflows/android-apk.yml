name: Android APK (release)

# Builds a small release APK in the cloud so nobody has to
# upload/download the 178 MB local debug APK.
# Fellow dev downloads from Actions artifacts (login needed)
# or from Releases (public link, no login) after a v* tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Split-per-abi => ~15-25 MB per APK instead of one giant
      # universal APK. Real phones need the arm64-v8a file.
      - name: Build release APK (split per ABI)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          MERCURY_API_KEYS: ${{ secrets.MERCURY_API_KEYS }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
            --dart-define=CLOUDINARY_UPLOAD_PRESET="$CLOUDINARY_UPLOAD_PRESET" \
            --dart-define=MERCURY_API_KEYS="$MERCURY_API_KEYS"

      # NOTE: defaults.run.working-directory does NOT apply to
      # uses: steps, so paths below must include the frontend/ prefix.
      - name: Upload APKs as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: frontend/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Only on tags like v1.0.0 -> creates a public Release page
      # with direct download links (no login needed to download).
      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
