name: Android APK (release)

# Builds a small release APK in the cloud so nobody has to
# upload/download the 178 MB local debug APK.
# Fellow dev downloads from Actions artifacts (login needed)
# or from Releases (public link, no login) after a v* tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # ------------------------------------------------------------------
      # Build inputs are written to a JSON file instead of being appended to
      # the flutter command line.
      #
      # Why: a secret whose value contains a line break, a quote or a comma
      # corrupts the argument vector. flutter then stops treating the token as
      # an option and tries to read it as the entrypoint, which is exactly the
      # failure: Target file "--dart-define=..." not found.
      # Writing a JSON file sidesteps quoting entirely, and we fail fast with a
      # readable message when a value is malformed instead of shipping a broken
      # or unreachable APK.
      # ------------------------------------------------------------------
      - name: Write dart-defines file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          required = ["SUPABASE_URL", "SUPABASE_ANON_KEY"]
          optional = ["CLOUDINARY_CLOUD_NAME", "CLOUDINARY_UPLOAD_PRESET"]

          def clean(name):
              raw = os.environ.get(name, "")
              value = raw.replace("\r\n", "\n").replace("\r", "\n").strip()
              if "\n" in value:
                  print("ERROR: secret %s contains a line break. "
                        "Re-save it as a single line with no trailing newline." % name,
                        file=sys.stderr)
                  sys.exit(1)
              return value

          out = {}
          for name in required:
              value = clean(name)
              if not value:
                  print("ERROR: repository secret %s is missing." % name, file=sys.stderr)
                  print("Add it under Settings > Secrets and variables > Actions.",
                        file=sys.stderr)
                  sys.exit(1)
              out[name] = value

          for name in optional:
              value = clean(name)
              if value:
                  out[name] = value
              else:
                  print("note: %s not set - that feature stays disabled in this build." % name)

          # MERCURY_API_KEYS is deliberately NOT shipped. A key compiled into an
          # APK can be extracted from the APK by anyone who downloads it, so the
          # AI copilot runs on its offline knowledge fallback in release builds.
          # The correct long-term path is a server-side proxy (Supabase Edge
          # Function) that holds the key and forwards the request.
          # If you knowingly accept the risk for a private/demo build only,
          # add MERCURY_API_KEYS to the `optional` list above and to the step env.

          with open("dart_defines.json", "w", encoding="utf-8") as handle:
              json.dump(out, handle, indent=2, sort_keys=True)

          print("dart-defines written for: %s" % ", ".join(sorted(out)))
          PY

      # Split-per-abi => ~15-25 MB per APK instead of one giant
      # universal APK. Real phones need the arm64-v8a file.
      # Single line on purpose: no shell line-continuation to get mangled.
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi --dart-define-from-file=dart_defines.json

      - name: Remove dart-defines file
        if: always()
        run: rm -f dart_defines.json

      # NOTE: defaults.run.working-directory does NOT apply to
      # uses: steps, so paths below must include the frontend/ prefix.
      - name: Upload APKs as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: frontend/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Only on tags like v1.0.0 -> creates a public Release page
      # with direct download links (no login needed to download).
      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
