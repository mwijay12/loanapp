name: loan_inventory_app
description: Mobile Phone Loan & Inventory Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  geolocator: ^11.0.0
  go_router: ^13.0.1
  http: ^1.1.0
  # 0.20.3 is the minimum required by the flutter_localizations bundled with
  # Flutter 3.47.8 stable. Pinning a lower major here makes `flutter pub get`
  # fail on every current stable:
  #   Because ... flutter_localizations from sdk depends on intl ^0.20.3,
  #   intl ^0.20.3 is required.
  intl: ^0.20.3
  pdf: ^3.10.0
  printing: ^5.11.0
  permission_handler: ^11.0.0
  supabase_flutter: ^2.0.0
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0
  mobile_scanner: ^5.0.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

