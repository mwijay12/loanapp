<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LIMS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1E60F2">
  <meta name="description" content="Branch stock, till sales and phone loans for a Tanzanian phone shop.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F2F7FE;
    }
  </style>


  <style>
    /* Launch surface. Deliberately plain CSS, not GSAP-only: if the library
       fails to load the brand still appears and still goes away. */
    #lims-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(1100px 600px at 15% 0%, #E8F0FF 0%, rgba(232,240,255,0) 60%),
        radial-gradient(900px 500px at 100% 100%, #E7F8F0 0%, rgba(231,248,240,0) 55%),
        #F7FAFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #lims-splash .mark {
      width: 86px;
      height: 86px;
      border-radius: 26px;
      background: linear-gradient(160deg, #3B82F6 0%, #1E60F2 55%, #1450D8 100%);
      box-shadow: 0 22px 44px -18px rgba(30, 96, 242, 0.75), inset 0 1px 0 rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #lims-splash .word {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: #0B1B3A;
    }
    #lims-splash .sub {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #7C8BA6;
      margin-top: -10px;
    }
    #lims-splash .track {
      width: 168px;
      height: 4px;
      border-radius: 99px;
      background: rgba(30, 96, 242, 0.14);
      overflow: hidden;
    }
    #lims-splash .fill {
      width: 0%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #1E60F2, #38BDF8);
    }
    #lims-splash.gone { display: none; }
  </style>

  <title>LIMS — Loan & Inventory</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <div id="lims-splash" role="status" aria-label="Loading LIMS">
    <div class="mark">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6.2" y="2.4" width="11.6" height="19.2" rx="3" stroke="#fff" stroke-width="1.9"/>
        <circle cx="12" cy="18.2" r="1.15" fill="#fff"/>
      </svg>
    </div>
    <div class="word">LIMS</div>
    <div class="sub">Loan &amp; Inventory</div>
    <div class="track"><div class="fill"></div></div>
  </div>

  <!-- GSAP is deferred; nothing waits on it. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script>
    (function () {
      var splash = document.getElementById('lims-splash');
      var fill = splash.querySelector('.fill');
      var reduce = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function dismiss() {
        if (!splash || splash.classList.contains('gone')) return;
        var done = function () { splash.classList.add('gone'); };
        if (window.gsap && !reduce) {
          window.gsap.to(splash, {
            opacity: 0, scale: 0.985, duration: 0.45, ease: 'power2.inOut',
            onComplete: done,
          });
        } else {
          done();
        }
      }

      function animate() {
        if (!window.gsap || reduce) {
          // No motion: show the bar half full so it never looks stalled.
          if (fill) fill.style.width = '60%';
          return;
        }
        var g = window.gsap;
        g.from('#lims-splash .mark', {
          scale: 0.7, opacity: 0, duration: 0.7, ease: 'back.out(1.7)',
        });
        g.from('#lims-splash .word', {
          y: 14, opacity: 0, duration: 0.55, delay: 0.12, ease: 'power3.out',
        });
        g.from('#lims-splash .sub', {
          y: 10, opacity: 0, duration: 0.5, delay: 0.2, ease: 'power3.out',
        });
        g.to('#lims-splash .fill', {
          width: '82%', duration: 1.6, delay: 0.15, ease: 'power1.out',
        });
      }

      // Flutter fires this on its first rendered frame.
      window.addEventListener('flutter-first-frame', dismiss);
      // A failed boot must not leave a permanent splash on top of the app.
      setTimeout(dismiss, 15000);

      if (window.gsap) animate();
      else window.addEventListener('load', animate);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
